# ==================================================================
# Dify 1.13.3 国内集群依赖测试栈
# ==================================================================
# 适用环境: 单独内网测试机 16C32G
# 包含: PostgreSQL 15 / Redis 7 / Milvus 2.4 (etcd + minio 依赖) / MinIO (Dify 文件)
#
# 跟生产差异:
#   - 生产: 阿里云 RDS / 阿里云 Redis / 独立 Milvus / 阿里云 OSS
#   - 测试: 全部 docker compose 本地起,MinIO 替代 OSS(S3 兼容)
#
# 资源预算 (16C32G 测试机, ~14C28G 可分配):
#   - PostgreSQL :    4.0 CPU / 8.0G    (重点放大,跑压测)
#   - Redis      :    0.5 CPU / 1.0G
#   - etcd       :    0.5 CPU / 0.5G    (Milvus 元数据)
#   - MinIO      :    1.0 CPU / 1.0G    (同时给 Milvus 和 Dify 用,2 个 bucket)
#   - Milvus     :    4.0 CPU / 8.0G    (向量数据库本体)
#   - 合计       :  ~10.0 CPU / ~18.5G  (留 ~4C/9.5G 系统 + Dify Pod 调度余量)
# ==================================================================
# 使用方法:
#   1. 启动: docker compose -f docker-compose-test.yaml up -d
#   2. 查看: docker compose -f docker-compose-test.yaml ps
#   3. 关闭: docker compose -f docker-compose-test.yaml down
#   4. 清空: docker compose -f docker-compose-test.yaml down -v   (删数据)
#
# 默认凭据 (仅测试用, 生产请改):
#   PostgreSQL : postgres / TestDifyPg!2025         (库 dify, dify_plugin 自动建)
#   Redis      : (无 user) / TestDifyRedis!2025
#   Milvus     : 无 auth (token/user/password 留空)
#   MinIO      : difyminio / TestDifyMinio!2025
#   MinIO 桶   : ai-dify-test (Dify) / milvus-data (Milvus) - 自动建
# ==================================================================
# 对应 values-secrets.yaml 填写示例 (cn-public-1.13.3 分支):
#
# externalPostgres:
#   enabled: true
#   username: "postgres"
#   address: "<测试机内网 IP>"
#   port: 5432
#   database:
#     api: "dify"
#     pluginDaemon: "dify_plugin"
#   password: "TestDifyPg!2025"
#
# externalRedis:
#   enabled: true
#   host: "<测试机内网 IP>"
#   port: 6379
#   username: ""
#   password: "TestDifyRedis!2025"
#   useSSL: false
#   db:                  # ⚠️ chart 模板硬要求,漏了 worker 启动崩
#     app: 0
#     celery: 1
#   sentinel:            # ⚠️ chart 模板硬要求,漏了 helm 渲染 nil pointer
#     enabled: false
#
# externalMilvus:
#   enabled: true
#   uri: "http://<测试机内网 IP>:19530"
#   database: "default"
#   token: ""            # standalone 默认无 auth
#   user: ""
#   password: ""
#
# # ⚠️ 测试期间用 MinIO 替代 OSS: externalOSS 关掉,启用 externalS3
# externalOSS:
#   enabled: false       # 测试期间关掉(生产是阿里云 OSS)
#
# externalS3:
#   enabled: true
#   endpoint: "http://<测试机内网 IP>:9000"
#   accessKey: "difyminio"
#   secretKey: "TestDifyMinio!2025"
#   region: "us-east-1"
#   bucketName:
#     api: "ai-dify-test"
#     pluginDaemon: "ai-dify-test"
#   pathStyle: true      # ⚠️ MinIO 必须 true
#   useIAM: false
# ==================================================================

services:
  # -------------------------------------------------------------
  # PostgreSQL: Dify 主库 + Plugin Daemon 库
  # ⚠️ 重点放大,压测对标生产 RDS(max_connections=3200,这里 1600 折半)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: dify-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: TestDifyPg!2025
      POSTGRES_DB: dify
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      # ---- 连接数 ----
      - "-c"
      - "max_connections=1600"          # 对标生产 RDS 3200,这里折半
      - "-c"
      - "superuser_reserved_connections=10"
      # ---- 内存 ----
      - "-c"
      - "shared_buffers=2GB"            # 25% mem(8G × 25%)
      - "-c"
      - "effective_cache_size=6GB"      # 75% mem(操作系统页缓存可用估算)
      - "-c"
      - "work_mem=32MB"                 # 单 query/sort 内存;高并发慎调大
      - "-c"
      - "maintenance_work_mem=512MB"    # VACUUM/CREATE INDEX 用
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      # ---- I/O / 并行 ----
      - "-c"
      - "random_page_cost=1.1"          # SSD
      - "-c"
      - "effective_io_concurrency=200"  # SSD
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_maintenance_workers=4"
      # ---- 会话/事务超时(与 Dify 配合)----
      - "-c"
      - "idle_in_transaction_session_timeout=900000"   # 15min,跟生产 RDS 一致
      - "-c"
      - "statement_timeout=600000"                      # 10min,防失控 query
      # ---- 日志(便于压测分析)----
      - "-c"
      - "log_min_duration_statement=1000"   # 慢查询 >1s 记录
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=10240"              # >10MB 的临时文件记录
      - "-c"
      - "log_line_prefix=%m [%p] %u@%d "
      # ---- 检查点 ----
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "checkpoint_timeout=15min"
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/test/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dify"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dify-test
    mem_limit: 8g
    mem_reservation: 2g
    cpus: 4.0
    shm_size: 1g            # PG 共享内存(并行 query 需要)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # 自动创建 dify_plugin 数据库 (PG 启动后只跑一次)
  postgres-init:
    image: postgres:15-alpine
    container_name: dify-test-postgres-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: TestDifyPg!2025
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -e
        echo "[init] ensuring database dify_plugin exists..."
        psql -h postgres -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='dify_plugin'" | grep -q 1 \
          || psql -h postgres -U postgres -c "CREATE DATABASE dify_plugin"
        echo "[init] done."
    networks:
      - dify-test

  # -------------------------------------------------------------
  # Redis: 缓存 + Celery broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dify-test-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "TestDifyRedis!2025"
      - "--maxmemory"
      - "768mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
      - "--save"
      - "60 1000"
      - "--tcp-backlog"
      - "511"
      - "--tcp-keepalive"
      - "60"
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/test/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "TestDifyRedis!2025", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dify-test
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 0.5

  # -------------------------------------------------------------
  # etcd: Milvus 元数据存储
  # -------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: dify-test-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - "etcd"
      - "-advertise-client-urls=http://etcd:2379"
      - "-listen-client-urls=http://0.0.0.0:2379"
      - "-data-dir=/etcd"
    volumes:
      - ./volumes/test/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - dify-test
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5

  # -------------------------------------------------------------
  # MinIO: S3 兼容对象存储
  #   - 同时给 Milvus(milvus-data bucket)和 Dify(ai-dify-test bucket)用
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: dify-test-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: difyminio
      MINIO_ROOT_PASSWORD: TestDifyMinio!2025
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - ./volumes/test/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dify-test
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0

  # 自动创建 bucket: ai-dify-test (Dify) + milvus-data (Milvus)
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: dify-test-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -e
        echo "[init] configuring mc alias..."
        mc alias set local http://minio:9000 difyminio 'TestDifyMinio!2025'
        echo "[init] ensuring bucket ai-dify-test..."
        mc mb --ignore-existing local/ai-dify-test
        echo "[init] ensuring bucket milvus-data..."
        mc mb --ignore-existing local/milvus-data
        echo "[init] done."
    networks:
      - dify-test

  # -------------------------------------------------------------
  # Milvus standalone: 向量数据库
  #   - 内部依赖 etcd(元数据) + minio(数据持久化)
  #   - 默认无 auth(token/user/password 留空即可)
  # -------------------------------------------------------------
  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    container_name: dify-test-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: difyminio
      MINIO_SECRET_ACCESS_KEY: TestDifyMinio!2025
      MINIO_BUCKET_NAME: milvus-data
      MINIO_USE_SSL: "false"
      QUERY_NODE_GRACEFUL_TIME: "1000"
    ports:
      - "19530:19530"   # gRPC (Dify 走这个)
      - "9091:9091"     # HTTP metrics / health
    volumes:
      - ./volumes/test/milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    networks:
      - dify-test
    mem_limit: 8g
    mem_reservation: 2g
    cpus: 4.0

networks:
  dify-test:
    name: dify-test
    driver: bridge
