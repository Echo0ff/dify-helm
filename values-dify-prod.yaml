# ============================================
# Dify Helm Chart - 生产环境配置（海外精品小集群 / Dify 1.13.3）
# ============================================
#
# 集群配置（3节点小集群）:
#   - Node 1-3: 4C/8G (standard)
#   - Milvus 独立容器（不在 K8s 内），占用 ~2C/4G
#
# 资源预算：
#   - 总资源：12C / 24G
#   - K8s 系统预留：~1.5C / 1.5G
#   - Milvus（容器）：~2C / 4G
#   - Dify 可用：~8.5C / 18.5G
#
# 部署命令：
# helm upgrade dify ./charts/dify -n dify \
#   -f values-dify.yaml \
#   -f values-secrets.yaml \
#   -f values-dify-prod.yaml
# ============================================

###################################
# 全局域名配置
# 1.13.x 迁移：原 api.url.appWeb / api.url.files 是死配置，
# 改用 global.appWebDomain / global.filesDomain（参见 charts/dify/templates/config.tpl）
###################################
global:
  appWebDomain: "http://3.19.168.125"
  filesDomain: "http://3.19.168.125"

###################################
# API 服务优化
###################################
api:
  enabled: true
  # 小集群：2 个副本足够
  replicas: 2

  # ⚠️ 资源配置：大幅降低以适应小集群
  resources:
    requests:
      cpu: "500m"       # 降低：原 1000m → 500m
      memory: "1Gi"     # 降低：原 2Gi → 1Gi
    limits:
      cpu: "1000m"      # 降低：原 2000m → 1000m
      memory: "2Gi"     # 降低：原 4Gi → 2Gi

  # 注意（1.13.x 迁移）：原通过 api.persistence.volumes 挂载 ConfigMap 覆盖 prompts.py 的方案已废弃
  # 1.13.x 起改用环境变量 SUGGESTED_QUESTIONS_PROMPT 在下方 extraEnv 中配置

  # HPA：小集群保守配置
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4        # 降低：原 4 → 3（资源有限）
    targetCPUUtilizationPercentage: 80   # 提高阈值，减少扩容频率
    targetMemoryUtilizationPercentage: 80

  # 健康检查
  livenessProbe:
    enabled: true
    initialDelaySeconds: 45
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 12
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 8
    successThreshold: 1

  # 滚动更新策略
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # 降低：原 3 → 1（资源有限）
      maxUnavailable: 0

  # Pod 拓扑分散：小集群更需要均匀分布
  topologySpreadConstraints:
    - maxSkew: 1          # 严格均匀分布
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: api

  # 亲和性：小集群简化配置
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: CHECK_UPDATE_URL
      value: ""
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Gunicorn 配置（1.13.x：SSE 代理需要更多长连接）
    - name: SERVER_WORKER_AMOUNT
      value: "2"          # 保持 2 个 worker
    - name: SERVER_WORKER_CLASS
      value: "gevent"
    - name: SERVER_WORKER_CONNECTIONS
      value: "50"         # 提高：30 → 50（1.13.x SSE 代理需要更多长连接）
    - name: GUNICORN_TIMEOUT
      value: "360"
    # ⚠️ 数据库连接池：blocking workflow 仍在 API 执行
    - name: SQLALCHEMY_POOL_SIZE
      value: "20"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "10"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"         # 快速失败，避免大量协程堆积等待
    - name: SQLALCHEMY_ECHO
      value: "false"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Redis 连接（1.13.x：替代失效的 REDIS_POOL_SIZE / REDIS_POOL_MAX_CONNECTIONS / CELERY_BROKER_POOL_LIMIT）
    - name: REDIS_MAX_CONNECTIONS
      value: "40"
    # 1.13.x 新增：SSE 事件总线走 Redis Streams（at-least-once）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查（Human Input Node）
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 性能配置
    - name: HTTP_REQUEST_MAX_CONNECT_TIMEOUT
      value: "30"
    - name: HTTP_REQUEST_MAX_READ_TIMEOUT
      value: "60"
    - name: HTTP_REQUEST_MAX_WRITE_TIMEOUT
      value: "30"
    - name: WEB_API_CORS_ALLOW_ORIGINS
      value: "*"
    - name: SENTRY_DSN
      value: ""
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务，无 pg_cron 分区表）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    # Graph Engine（blocking workflow 在 API 内执行）
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "5"
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"
    # Custom Prompts（1.13.x 起支持环境变量覆盖，替代旧的 ConfigMap 挂载 prompts.py）
    - name: SUGGESTED_QUESTIONS_PROMPT
      value: "Please help me predict the three most likely questions that human would ask, and keep each question under 20 characters.\nMAKE SURE your output is the SAME language as the Assistant's latest response. The output must be an array in JSON format following the specified schema:\n[\"question1\",\"question2\",\"question3\"]\n"

###################################
# Worker 服务优化
###################################
worker:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置（1.13.x：Worker 承接 9% streaming workflow + 后台任务，适度提高 CPU 上限）
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"
    limits:
      cpu: "2500m"        # 提高：2000m → 2500m（streaming workflow 计算压力）
      memory: "5Gi"

  # autoscaling:
  #   enabled: true
  #   minReplicas: 2
  #   maxReplicas: 3
  #   targetCPUUtilizationPercentage: 80
  #   targetMemoryUtilizationPercentage: 85

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: worker

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 40
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Worker 数据库连接池（1.13.x：streaming workflow + LLM I/O 持连接）
    - name: SQLALCHEMY_POOL_SIZE
      value: "15"         # 提高：10 → 15（streaming workflow 持有 LLM 长连接）
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"         # 降低：180 → 30（快速失败）
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Celery Worker（1.13.x：使用固定 CELERY_WORKER_AMOUNT，替代 CELERY_MAX_WORKERS / CELERY_MIN_WORKERS）
    - name: CELERY_AUTO_SCALE
      value: "false"
    - name: CELERY_WORKER_AMOUNT
      value: "3"          # streaming 峰值 1-3 并发，3 个 gevent 协程足够
    - name: CELERY_WORKER_CLASS
      value: "gevent"
    - name: CELERY_PREFETCH_MULTIPLIER
      value: "1"
    - name: MAX_TASKS_PER_CHILD
      value: "100"        # 修正拼写：原 MAX_TASK_PRE_CHILD（typo）→ MAX_TASKS_PER_CHILD
    # Redis（1.13.x：替代失效的 REDIS_POOL_SIZE / REDIS_POOL_MAX_CONNECTIONS）
    - name: REDIS_MAX_CONNECTIONS
      value: "30"
    # 1.13.x 新增：SSE 事件总线（必须与 API 一致）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务，无 pg_cron 分区表）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "6"          # 提高：5 → 6（Worker 承接 streaming workflow，需更多并行能力）
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"

###################################
# Beat 服务（定时任务调度器）
###################################
beat:
  enabled: true

  # ⚠️ 资源配置：修复OOMKilled问题
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"     # 提高：原 128Mi → 256Mi（启动需要更多内存）
    limits:
      cpu: "500m"         # 提高：原 300m → 500m
      memory: "512Mi"     # 提高：原 256Mi → 512Mi（修复OOMKilled）

  updateStrategy:
    type: Recreate

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # Beat 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "3"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "2"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"

###################################
# Web 前端服务优化
###################################
web:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "500m"         # 降低：原 500m → 100m
      memory: "512Mi"     # 降低：原 512Mi → 512Mi
    limits:
      cpu: "2000m"         # 降低：原 1000m → 1000m
      memory: "1Gi"     # 降低：原 1Gi → 1Gi

  autoscaling:
    enabled: false        # 小集群关闭 HPA，节省资源

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname

###################################
# Sandbox 服务优化（代码执行）
###################################
sandbox:
  enabled: true
  replicas: 2             # ⚠️ 降低：原 2 → 1（节省资源）

  # ⚠️ 资源配置：大幅降低
  resources:
    requests:
      cpu: "1000m"         # 降低：原 1000m → 200m
      memory: "512Mi"     # 降低：原 2Gi → 512Mi
    limits:
      cpu: "3000m"         # 降低：原 2000m → 3000m
      memory: "2Gi"     # 降低：原 4Gi → 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2        # 降低：原 2 → 1
    maxReplicas: 3        # 降低：原 3 → 2
    targetCPUUtilizationPercentage: 70

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - sandbox
            topologyKey: kubernetes.io/hostname

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: WORKER_TIMEOUT
      value: "15"

###################################
# Proxy 服务优化
###################################
proxy:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "128Mi"     # 降低：原 256Mi → 128Mi
    limits:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "256Mi"     # 降低：原 512Mi → 256Mi

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - proxy
            topologyKey: kubernetes.io/hostname

  clientMaxBodySize: "100m"

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# SSRF Proxy 服务
###################################
ssrfProxy:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
