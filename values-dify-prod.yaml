# ============================================
# Dify Helm Chart - 生产环境配置（国内公共集群 / Dify 1.13.3）
# ============================================
# 说明：
# - 本文件为国内公共集群生产配置（已升级至 1.13.3）
# - 目标容量：100+ RPS，4-10 副本 API 弹性扩缩
# - 配合 values-secrets.yaml 使用
#
# 集群配置（3 节点同构 HA 集群）:
#   - Node 1-3: 16C/32G（共 48C/96G，无 node-type 分级）
#
# 外部依赖（生产）:
#   - PostgreSQL: 阿里云 RDS（max_connections=3200）
#   - Redis:      阿里云 Redis
#   - 向量库:     独立 Milvus（集群外 docker 部署）
#   - 对象存储:   阿里云 OSS
#
# 部署命令：
# helm upgrade dify ./charts/dify -n dify \
#   -f values-dify.yaml \
#   -f values-secrets.yaml \
#   -f values-dify-prod.yaml
# ============================================

###################################
# 全局域名配置
# 1.13.x 迁移：原 api.url.appWeb / api.url.files 已废弃，
# 改用 global.appWebDomain / global.filesDomain
# （参见 charts/dify/templates/config.tpl）
# TODO: 绿集群 IP/域名待替换（当前为旧蓝集群 47.97.245.112，仅占位）
###################################
global:
  appWebDomain: "http://47.97.245.112"
  filesDomain: "http://47.97.245.112"

###################################
# API 服务优化（最关键）
###################################
api:
  enabled: true

  # ──────────────────────────────────────────────────────────────
  # 🔄 升级模式切换（每次 helm upgrade 前后都要切一次）
  #
  # 原理: 升级时 api 必须单副本跑 alembic migration（alembic 不支持并发）；
  #       worker / plugin-daemon / beat 都带 check-api initContainer，
  #       会自动 curl api /health，api 没 ready 它们就一直等，不会乱起。
  #
  # 切换步骤:
  #   ① 升级前: 注释【正常运行】4 行，取消注释【升级模式】4 行 → helm upgrade
  #   ② 等 api pod 日志出现 "Migration completed" 且 Ready 1/1
  #   ③ 升级后: 反过来切回【正常运行】 → 再 helm upgrade 一次
  # ──────────────────────────────────────────────────────────────

  # # 【升级模式】api 单副本 + HPA 关闭（用完反注释）
  # replicas: 1
  # autoscaling:
  #   enabled: false

  # 【正常运行】新集群 16C32G×3:api 起步 4 副本 + HPA(min 4 / max 10)
  # 容量评估:100 RPS 单 pod ~20 RPS,4 副本即可承接,HPA 上限 10 防内存挤爆 pluginDaemon
  replicas: 4


  # 资源配置（单 Pod 实测 CPU ~250m / MEM ~1.3Gi）
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

  # 自定义 prompts:1.13.x 起改用环境变量(SUGGESTED_QUESTIONS_PROMPT)注入,
  # 不再挂载 ConfigMap 覆盖 /app/api/core/llm_generator/prompts.py
  # 见下方 extraEnv 段

  # 启用水平自动伸缩(HPA)
  autoscaling:
    enabled: true
    minReplicas: 4            # 100 RPS 需 ~5 pod,4 起步 + HPA 弹一档兜住
    maxReplicas: 10           # 上限 10:平衡 100 RPS 容量与 HPA 峰值内存预算
    targetCPUUtilizationPercentage: 70    # 70% 扩容,瞬时尖峰不会过度触发
    targetMemoryUtilizationPercentage: 75

  # 优化健康检查
  livenessProbe:
    enabled: true
    initialDelaySeconds: 45
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 12
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 8
    successThreshold: 1

  # 滚动更新策略
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1               # 滚更只多 1 个 pod,控制临时内存占用
      maxUnavailable: 0

  # Pod 拓扑分散:3 节点上严格均匀
  topologySpreadConstraints:
    - maxSkew: 1                  # 严格均匀分布到 3 个节点
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: api

  # 亲和性:新集群无 node-type label,只保留 podAntiAffinity 适度分散
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 20              # 低权重,允许同节点多 Pod
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname
  
  # 保持现有环境变量配置
  logLevel: INFO  # 生产环境建议 INFO，减少日志开销（DEBUG 会影响性能）
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: CHECK_UPDATE_URL
      value: ""
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "4000000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # 自定义"猜你想问"prompt(替代旧版 ConfigMap 挂载方案)
    # 对应 dify 1.13.x: api/core/llm_generator/prompts.py 中的 SUGGESTED_QUESTIONS_AFTER_ANSWER_INSTRUCTION_PROMPT
    - name: SUGGESTED_QUESTIONS_PROMPT
      value: |
        请帮我预测用户最可能问的三个问题，每个问题控制在20个字符以内。
        确保你的输出语言与助手最新回复的语言保持一致。输出必须是JSON数组格式，遵循以下模式：
        ["问题1","问题2","问题3"]
    # Gunicorn 配置（SSE 长连接需要充足协程槽位）
    - name: SERVER_WORKER_AMOUNT
      value: "2"                # 每个 Pod 2 个 worker 进程
    - name: SERVER_WORKER_CLASS
      value: "gevent"           # 异步 worker 提升并发能力
    - name: SERVER_WORKER_CONNECTIONS
      value: "50"               # 单 worker 50 协程(单 pod 100 协程,4-10 pod = 400-1000 协程)
    - name: GUNICORN_TIMEOUT
      value: "360"              # 超时 6 分钟（适合长时间运行的工作流）
    # 数据库连接池
    # RDS idle_in_transaction_session_timeout 设为 15min（2026-02-25）
    # 连接数预算：单 Pod 2 worker × (60+30) = 180 连接
    # 峰值预算：API 10 × 180 + Worker 8 × (40+20) + Plugin 2 × (20+10) + Beat 15 ≈ 2355 / 3200（74%）
    - name: SQLALCHEMY_POOL_SIZE
      value: "60"               # 每 worker 进程 60 个常驻连接
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "30"               # 溢出 30 个（合计 90/worker，峰值 180/Pod）
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "3600"             # 官方默认 1 小时，配合 PRE_PING 检测失效连接
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"             # checkout 时检查连接有效性
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"               # 30 秒等不到连接就快速失败
    - name: SQLALCHEMY_ECHO
      value: "false"
    - name: SQLALCHEMY_ECHO_POOL
      value: "false"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"         # 归还连接时自动回滚未提交事务
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "false"            # FIFO 模式:让 POOL_RECYCLE 有效淘汰旧连接
    # Redis 连接（1.13.x：原 REDIS_POOL_SIZE/REDIS_POOL_MAX_CONNECTIONS/CELERY_BROKER_POOL_LIMIT 已失效）
    - name: REDIS_MAX_CONNECTIONS
      value: "60"               # 单 Pod 最大 60 个连接（峰值时使用）
    # 1.13.x 新增：SSE 事件总线走 Redis Streams（at-least-once）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查（Human Input Node）
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 性能优化配置
    - name: HTTP_REQUEST_MAX_CONNECT_TIMEOUT
      value: "30"               # HTTP 请求连接超时
    - name: HTTP_REQUEST_MAX_READ_TIMEOUT
      value: "60"               # HTTP 请求读取超时
    - name: HTTP_REQUEST_MAX_WRITE_TIMEOUT
      value: "30"               # HTTP 请求写入超时
    - name: RETRY_TIMES
      value: "3"                # 重试次数
    - name: WEB_API_CORS_ALLOW_ORIGINS
      value: "*"                # CORS 配置（如需更严格请调整）
    # 禁用不必要的功能提升性能
    - name: SENTRY_DSN
      value: ""                 # 关闭 Sentry（减少性能开销）
    # 自动删除日志
    # Enable automatic cleanup of workflow run logs to manage database size
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    # Number of days to retain workflow run logs (default: 30 days)
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    # Batch size for workflow log cleanup operations (default: 100)
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"  # 增加初始并行 worker 数
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "5"  # 最大并行数
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"  # 降低扩容阈值，更快触发并行
    - name: UPLOAD_IMAGE_FILE_SIZE_LIMIT
      value: "100"  # 单位是 MB，
    # 最大二进制文件大小100MB,文字大小10MB
    - name: HTTP_REQUEST_NODE_MAX_BINARY_SIZE
      value: "104857600"
    - name: HTTP_REQUEST_NODE_MAX_TEXT_SIZE
      value: "10485760"

###################################
# Worker 服务优化（异步任务处理 - 主要处理知识库索引）
###################################
worker:
  enabled: true
  # 1.13.x 重要变化:streaming workflow 全部下沉到 celery worker 执行
  # 容量预算(日均 200 万请求, 流式:非流式 = 1:9):
  #   - 流式约 20 万/天, 业务 8h 内峰值 ~20 RPS, SSE 平均 5-30s
  #   - 同时在线流式任务 peak ≈ 200-300 个 → 单 pod 6 进程 × gevent 协程能撑 ~600
  replicas: 4                   # 起步 4 副本承接均值

  # 资源配置(streaming workflow 比纯异步索引重,需要更多 CPU/MEM)
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2500m"              # streaming 时 graph engine 并行计算
      memory: "5Gi"

  autoscaling:
    enabled: true
    minReplicas: 4              # 起步 4 副本
    maxReplicas: 10             # 峰值 10:足以撑 200-300 并发流式任务
    targetCPUUtilizationPercentage: 60    # streaming 是 IO 密集,CPU 60% 早扩
    targetMemoryUtilizationPercentage: 70
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # 拓扑分散约束：均匀分布
  topologySpreadConstraints:
    - maxSkew: 1                  # Worker 保持均匀分布（任务处理需要负载均衡）
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: worker
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 40              # 适度分散
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname

  logLevel: INFO
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # Worker 数据库连接池(4-10 Pod × (40+20) = 240-600 连接)
    - name: SQLALCHEMY_POOL_SIZE
      value: "40"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "20"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "3600"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"               # 30 秒快速失败
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "false"            # FIFO 模式
    # Celery Worker(1.13.x:使用固定 CELERY_WORKER_AMOUNT,替代 CELERY_MAX_WORKERS / CELERY_MIN_WORKERS / CELERY_AUTO_SCALE)
    # 单 pod 总并发 = CELERY_WORKER_AMOUNT × gevent 协程,目标承接 streaming workflow
    - name: CELERY_WORKER_AMOUNT
      value: "6"                # 单 pod 6 进程 × gevent 协程 ≈ 单 pod 600+ 并发任务
    - name: CELERY_WORKER_CLASS
      value: "gevent"           # gevent 协程,适合 LLM SSE 等 IO 等待
    - name: CELERY_PREFETCH_MULTIPLIER
      value: "1"                # streaming 任务长,预取 1 避免抢任务不释放
    - name: MAX_TASKS_PER_CHILD
      value: "200"              # 200 个任务后 worker 重启,防内存泄漏;streaming 比索引任务长,提高重启间隔
    # Redis(1.13.x:原 REDIS_POOL_SIZE / REDIS_POOL_MAX_CONNECTIONS 已失效)
    - name: REDIS_MAX_CONNECTIONS
      value: "50"               # celery broker 走 redis,6 进程 × ~8 连接 = 48,留余量
    # 1.13.x 新增：SSE 事件总线（必须与 API 一致）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 自动删除日志
    # Enable automatic cleanup of workflow run logs to manage database size
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    # Number of days to retain workflow run logs (default: 30 days)
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    # Batch size for workflow log cleanup operations (default: 100)
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "4000000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    # Graph Engine 并行(worker 内部 streaming workflow 节点级并行)
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "8"                # streaming workflow 节点级并行,从 5 提到 8 应对流式高并发
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"                # 降低扩容阈值,更快触发并行

###################################
# Beat 服务（定时任务调度器）
###################################
beat:
  enabled: true
  # Beat 只需要 1 个副本（多个会重复执行定时任务）
  
  # 资源配置（基于实测：CPU ~0m，MEM 281Mi — 注意已超过原request 256Mi）
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"           # 512Mi→768Mi（给更多余量）
  
  updateStrategy:
    type: Recreate             # Beat 使用 Recreate 策略（避免多实例）
  
  logLevel: INFO
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # Beat 数据库连接池（1 Pod，10+5=15 峰值）
    - name: SQLALCHEMY_POOL_SIZE
      value: "10"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "3600"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "false"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 自动删除日志
    # Enable automatic cleanup of workflow run logs to manage database size
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    # Number of days to retain workflow run logs (default: 30 days)
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    # Batch size for workflow log cleanup operations (default: 100)
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "4000000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"

###################################
# Web 前端服务优化
###################################
web:
  enabled: true
  replicas: 2                   # 前端静态资源,2 副本 + HPA 扩到 4 足够

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    - name: MAX_PARALLEL_LIMIT
      value: "50"
    - name: TOP_K_MAX_VALUE
      value: "20"
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname

###################################
# Sandbox 服务优化（代码执行）
###################################
sandbox:
  enabled: true
  replicas: 2                   # 代码节点流量小,2 起步 + HPA 扩到 6

  resources:
    requests:
      cpu: "500m"               # 释放调度空间,limits 不变保代码节点突发
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "6Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70    # 60→70:减少瞬时尖峰扩容
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - sandbox
            topologyKey: kubernetes.io/hostname
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: WORKER_TIMEOUT
      value: "15"
    - name: PIP_MIRROR_URL
      value: "https://mirrors.aliyun.com/pypi/simple/"

###################################
# Proxy 服务优化
###################################
proxy:
  enabled: true
  replicas: 2                   # nginx 转发轻量,2 副本足够
  
  resources:
    requests:
      cpu: "500m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - proxy
            topologyKey: kubernetes.io/hostname
  
  # Nginx 优化配置
  clientMaxBodySize: "100m"     # 增加上传大小限制

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# SSRF Proxy 服务
###################################
ssrfProxy:
  enabled: true
  replicas: 2

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"             # 历史曾出过 OOM,留 2Gi 余量
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# Plugin Daemon 服务
###################################
pluginDaemon:
  enabled: true
  # 2 副本:容忍 1 个副本故障 + 滚动更新可零停机;内存预算 12Gi × 2 = 24Gi
  replicas: 2

  # 资源配置（实测 CPU ~350m / MEM ~11Gi,143 个插件进程;内存由插件数量决定,非流量驱动）
  # 强烈建议清理重复版本插件以降低内存（可释放 3-4Gi）
  resources:
    requests:
      cpu: "1000m"
      memory: "12Gi"
    limits:
      cpu: "4000m"
      memory: "16Gi"            # 余量防插件增多后 OOM
  
  # ========= 探针策略 =========
  # 实测数据（143个插件）：Pod 启动到 Ready 约 242 秒
  # 问题：tcpSocket 只检查端口是否监听，端口在编译完成前就已开放，
  #       必须用 initialDelaySeconds 作为时间安全阀。
  # 方案：startupProbe（编译等待）+ readinessProbe（运行时健康检查）分离
  #   - startupProbe 期间：readinessProbe 不运行，Pod 不接收流量
  #   - startupProbe 通过后：readinessProbe 接管，快速检测运行时故障
  #   - 滚动更新时：旧 Pod 在整个 startupProbe 期间保持服务
  #
  # ⚠️ 如果后续插件增多导致编译变慢，调大 initialDelaySeconds（当前 300 秒）

  # startupProbe：等待插件编译完成（此期间 Pod 不接收流量）
  customStartupProbe:
    tcpSocket:
      port: 5002
    initialDelaySeconds: 360    # 6分钟后开始探测（实测编译<4分钟，留25%余量）
    periodSeconds: 10           # 之后每10秒探测
    timeoutSeconds: 5
    failureThreshold: 20        # 再允许30次失败（总窗口: 360+200=560秒=11分钟）
    successThreshold: 1

  # readinessProbe：编译完成后的持续健康检查（startupProbe 通过后才启用）
  customReadinessProbe:
    tcpSocket:
      port: 5002
    initialDelaySeconds: 5      # startupProbe 已确认启动完成，几乎不用等
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3         # 3次失败即从 Endpoints 摘除（30秒内快速检测故障）
    successThreshold: 1
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - plugin-daemon
            topologyKey: kubernetes.io/hostname
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # 1.13.x 升级踩坑：云 RDS 强制 SSL，pgx 默认 disable 必须显式开启
    # （海外 AWS RDS / 国内阿里云 RDS 都是这个坑，不加这行 plugin-daemon 起不来）
    - name: DB_SSL_MODE
      value: "require"
    - name: PIP_MIRROR_URL
      value: "https://mirrors.aliyun.com/pypi/simple/"
    # PluginDaemon 数据库连接池（3 Pod，每 Pod 20+10=30 峰值 = 90 连接）
    - name: SQLALCHEMY_POOL_SIZE
      value: "20"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "10"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"              # 240秒回收连接（数据库超时300秒）
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "120"              # 增加超时时间
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 自动删除日志
    # Enable automatic cleanup of workflow run logs to manage database size
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    # Number of days to retain workflow run logs (default: 30 days)
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    # Batch size for workflow log cleanup operations (default: 100)
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: FORCE_VERIFYING_SIGNATURE
      value: "false"

###################################
# Service 配置
# 注意：Ingress 配置继承自 values-dify.yaml，不在此覆盖
###################################
service:
  type: ClusterIP
  port: 80

###################################
# 全局资源配置
###################################
# 注意：这里的 resources 是示例，实际每个组件已经单独配置
resources: {}

###################################
# 全局节点选择器（如有特殊需求）
###################################
nodeSelector: {}

###################################
# 全局容忍度
###################################
# ⚠️ 关键 HA 优化：缩短节点故障时的 Pod 驱逐时间
# 默认 tolerationSeconds=300（5分钟），节点宕机后 Pod 要 5 分钟才从 Endpoints 摘除。
# 改为 30 秒后，节点宕机 → 40秒检测 + 30秒容忍 = 约 70 秒即驱逐（原来需要 340 秒）。
# 这比改 k3s 配置更安全：只影响 Dify 的 Pod，不影响系统组件，无需重启 k3s。
tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 30       # 默认300→30，节点 NotReady 后 30秒驱逐
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 30       # 默认300→30，节点 Unreachable 后 30秒驱逐

###################################
# 全局亲和性
###################################
affinity: {}

# ==============================================================================
# 新集群配置说明（16C32G × 3 = 48C/96G,向量库 Milvus 已独立到集群外）
# ==============================================================================
#
# 流量假设(日均 200 万请求, 流式:非流式 = 1:9):
#   - 流式(api 处理): 180 万/天, 业务 8h 峰值 ~150 RPS
#   - 流式(worker 处理): 20 万/天, 业务 8h 峰值 ~20 RPS, SSE 5-30s
#   - 同时在线流式任务 peak ≈ 200-300 个
#
# 资源分配预算（requests 维度,常态）:
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ 组件           │ 副本 │ CPU req │ 内存 req │ 备注                       │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ API            │ 4    │ 4000m   │ 8Gi      │ HPA 4-10, 非流式请求       │
# │ Worker         │ 4    │ 4000m   │ 8Gi      │ HPA 4-10, streaming 等     │
# │ Beat           │ 1    │ 200m    │ 256Mi    │                            │
# │ Web            │ 2    │ 1000m   │ 1Gi      │ HPA 2-4                    │
# │ Sandbox        │ 2    │ 1000m   │ 2Gi      │ HPA 2-6                    │
# │ Proxy          │ 2    │ 1000m   │ 512Mi    │                            │
# │ SSRF Proxy     │ 2    │ 1000m   │ 2Gi      │                            │
# │ Plugin Daemon  │ 2    │ 2000m   │ 24Gi     │ 内存硬需求(143 插件)       │
# ├──────────────────────────────────────────────────────────────────────────┤
# │ Dify 总计      │ -    │ ~14.2c  │ ~45.8Gi  │                            │
# │ K8s 系统预留   │ -    │ ~4.5c   │ ~6Gi     │ 3 节点 × 1.5C/2G           │
# │ 总常态         │ -    │ ~18.7c  │ ~51.8Gi  │ 占 39% / 54%               │
# │ 集群可用       │ -    │ 48c     │ 96Gi     │                            │
# │ HPA 余量       │ -    │ ~29c    │ ~44Gi    │ 给峰值扩容用               │
# └──────────────────────────────────────────────────────────────────────────┘
#
# HPA 峰值预算（API 10 / Worker 10 / Sandbox 6 / Web 4）:
#   - API 峰值:     10 × 1c/2Gi  = 10c/20Gi  (+6c/+12Gi)
#   - Worker 峰值:  10 × 1c/2Gi  = 10c/20Gi  (+6c/+12Gi)  ← streaming 承载主力
#   - Sandbox 峰值:  6 × 0.5c/1Gi = 3c/6Gi   (+2c/+4Gi)
#   - Web 峰值:      4 × 0.5c/0.5Gi = 2c/2Gi (+1c/+1Gi)
#   - 峰值合计:     ~30c / 79Gi (集群 63% / 82%, 健康)
#   - 注:api/worker 不会同时打满 HPA (流式:非流式 = 1:9, 两者负载反相关)
#
# 数据库连接数预算（RDS max_connections = 3200,green 完全克隆 blue 配置）:
#   - API:          10 Pod × 2 worker × (60+30) = 1800 (HPA 峰值)
#   - Worker:       10 Pod × (40+20)            = 600  (streaming 持连接)
#   - PluginDaemon:  2 Pod × (20+10)            = 60
#   - Beat:          1 Pod × (10+5)             = 15
#   - 总计峰值:     ~2475 / 3200 (77%, 有 23% 余量)
#
# Celery worker 并发模型(承接 streaming workflow):
#   - 单 pod: CELERY_WORKER_AMOUNT=6 × gevent 协程 ≈ 600 任务理论上限
#   - GRAPH_ENGINE_MAX_WORKERS=8: 每个 streaming workflow 内部节点级并行
#   - MAX_TASKS_PER_CHILD=200: streaming 任务比索引长,重启间隔提高
#   - 10 pod 峰值: 6000 并发槽位,远超 200-300 实际并发
#
# 向量库（外部 Milvus,独立 docker）:
#   - 启用方式（values-secrets.yaml）:
#       externalMilvus.enabled: true
#       externalMilvus.uri: "http://<milvus-host>:19530"
#
# 100 RPS 容量评估:
#   - API 单 pod: 2 worker × 50 conn = 100 协程,假设 5s/请求 ≈ 20 RPS
#   - 100 RPS 仅需 5 pod,4 起步 + HPA 一档即可,集群只用到约 50% 容量
#   - 突发可弹至 10 pod,理论上限 ~200 RPS
#
# 关键监控指标:
#   - API Pod CPU/Memory 使用率（目标 <70%）
#   - HPA 伸缩事件（观察扩缩容频率）
#   - PostgreSQL 连接数（目标 <2400）
#   - Milvus QPS / 查询延迟
#
# 部署命令:
# helm upgrade dify charts/dify -f values-dify.yaml -f values-secrets.yaml -f values-dify-prod.yaml -n dify
# ==============================================================================
#
# 注意:邮件配置请在 values-secrets.yaml 中配置（包含敏感信息）

