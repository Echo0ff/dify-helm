# ============================================
# Dify Helm Chart - 生产环境配置（海外精品小集群 / Dify 1.13.3）
# ============================================
#
# 集群配置（3节点小集群）:
#   - Node 1-3: 4C/8G (standard)
#   - 总资源：12C / 24G
#
# 向量库：外部 Qdrant（独立部署在 K8s 集群外，不占用 K8s 资源）
#   - 启用方式：在 values-secrets.yaml 中设置
#       externalQdrant.enabled: true
#       externalQdrant.endpoint: "http://<qdrant-host>:6333"
#       externalQdrant.apiKey: "<api-key>"
#   - Dify 1.13.x 起统一使用 VECTOR_STORE=qdrant（由 helm 模板根据 enabled 自动注入）
#
# 资源预算（向量库已独立，全部资源给 Dify + K8s 系统）：
#   - 总资源：12C / 24G
#   - K8s 系统预留：~1.5C / 1.5G
#   - Dify 可用：~10.5C / 22G（原 8.5C/18.5G → 多出 ~2C/4G 余量）
#   - 余量策略：单 Pod limits 保持不变，多出资源交给 HPA 弹性扩容
#
# 部署命令：
# helm upgrade dify ./charts/dify -n dify \
#   -f values-dify.yaml \
#   -f values-secrets.yaml \
#   -f values-dify-prod.yaml
# ============================================

###################################
# 全局域名配置
# 1.13.x 迁移：原 api.url.appWeb / api.url.files 是死配置，
# 改用 global.appWebDomain / global.filesDomain（参见 charts/dify/templates/config.tpl）
###################################
global:
  appWebDomain: "http://3.19.168.125"
  filesDomain: "http://3.19.168.125"

###################################
# API 服务优化
###################################
api:
  enabled: true
  # 小集群：2 个副本足够
  replicas: 2

  # ⚠️ 资源配置：大幅降低以适应小集群
  resources:
    requests:
      cpu: "500m"       # 降低：原 1000m → 500m
      memory: "1Gi"     # 降低：原 2Gi → 1Gi
    limits:
      cpu: "1000m"      # 降低：原 2000m → 1000m
      memory: "2Gi"     # 降低：原 4Gi → 2Gi

  # 注意（1.13.x 迁移）：原通过 api.persistence.volumes 挂载 ConfigMap 覆盖 prompts.py 的方案已废弃
  # 当前使用 Dify 1.13.x 内置默认 prompt（多语言友好，自动适配响应语言）
  # 如需自定义，可在 extraEnv 中追加 SUGGESTED_QUESTIONS_PROMPT 等环境变量

  # HPA：向量库独立后释放资源，maxReplicas 提高（4 → 5），多出资源交给 autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5        # 提高：4 → 5（向量库独立后释放 ~2C/4G，HPA 多 1 个副本余量）
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  # 健康检查
  livenessProbe:
    enabled: true
    initialDelaySeconds: 45
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 12
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 8
    successThreshold: 1

  # 滚动更新策略
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # 降低：原 3 → 1（资源有限）
      maxUnavailable: 0

  # Pod 拓扑分散：小集群更需要均匀分布
  topologySpreadConstraints:
    - maxSkew: 1          # 严格均匀分布
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: api

  # 亲和性：小集群简化配置
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: CHECK_UPDATE_URL
      value: ""
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Gunicorn 配置（1.13.x：SSE 代理需要更多长连接）
    - name: SERVER_WORKER_AMOUNT
      value: "2"          # 保持 2 个 worker
    - name: SERVER_WORKER_CLASS
      value: "gevent"
    - name: SERVER_WORKER_CONNECTIONS
      value: "50"         # 提高：30 → 50（1.13.x SSE 代理需要更多长连接）
    - name: GUNICORN_TIMEOUT
      value: "360"
    # ⚠️ 数据库连接池：blocking workflow 仍在 API 执行
    - name: SQLALCHEMY_POOL_SIZE
      value: "20"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "10"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"         # 快速失败，避免大量协程堆积等待
    - name: SQLALCHEMY_ECHO
      value: "false"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Redis 连接（1.13.x：替代失效的 REDIS_POOL_SIZE / REDIS_POOL_MAX_CONNECTIONS / CELERY_BROKER_POOL_LIMIT）
    - name: REDIS_MAX_CONNECTIONS
      value: "40"
    # 1.13.x 新增：SSE 事件总线走 Redis Streams（at-least-once）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查（Human Input Node）
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 性能配置
    - name: HTTP_REQUEST_MAX_CONNECT_TIMEOUT
      value: "30"
    - name: HTTP_REQUEST_MAX_READ_TIMEOUT
      value: "60"
    - name: HTTP_REQUEST_MAX_WRITE_TIMEOUT
      value: "30"
    - name: WEB_API_CORS_ALLOW_ORIGINS
      value: "*"
    - name: SENTRY_DSN
      value: ""
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务，无 pg_cron 分区表）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    # Graph Engine（blocking workflow 在 API 内执行）
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "5"
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"

###################################
# Worker 服务优化
###################################
worker:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置（1.13.x：Worker 承接 9% streaming workflow + 后台任务，适度提高 CPU 上限）
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"
    limits:
      cpu: "2500m"        # 提高：2000m → 2500m（streaming workflow 计算压力）
      memory: "5Gi"

  # autoscaling:
  #   enabled: true
  #   minReplicas: 2
  #   maxReplicas: 3
  #   targetCPUUtilizationPercentage: 80
  #   targetMemoryUtilizationPercentage: 85

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: worker

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 40
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Worker 数据库连接池（1.13.x：streaming workflow + LLM I/O 持连接）
    - name: SQLALCHEMY_POOL_SIZE
      value: "15"         # 提高：10 → 15（streaming workflow 持有 LLM 长连接）
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "30"         # 降低：180 → 30（快速失败）
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Celery Worker（1.13.x：使用固定 CELERY_WORKER_AMOUNT，替代 CELERY_MAX_WORKERS / CELERY_MIN_WORKERS）
    - name: CELERY_AUTO_SCALE
      value: "false"
    - name: CELERY_WORKER_AMOUNT
      value: "3"          # streaming 峰值 1-3 并发，3 个 gevent 协程足够
    - name: CELERY_WORKER_CLASS
      value: "gevent"
    - name: CELERY_PREFETCH_MULTIPLIER
      value: "1"
    - name: MAX_TASKS_PER_CHILD
      value: "100"        # 修正拼写：原 MAX_TASK_PRE_CHILD（typo）→ MAX_TASKS_PER_CHILD
    # Redis（1.13.x：替代失效的 REDIS_POOL_SIZE / REDIS_POOL_MAX_CONNECTIONS）
    - name: REDIS_MAX_CONNECTIONS
      value: "30"
    # 1.13.x 新增：SSE 事件总线（必须与 API 一致）
    - name: PUBSUB_REDIS_CHANNEL_TYPE
      value: "streams"
    - name: PUBSUB_STREAMS_RETENTION_SECONDS
      value: "600"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解 + 插件相关
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    - name: PLUGIN_DAEMON_TIMEOUT
      value: "600.0"
    - name: PLUGIN_MODEL_SCHEMA_CACHE_TTL
      value: "3600"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务，无 pg_cron 分区表）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "3"
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "6"          # 提高：5 → 6（Worker 承接 streaming workflow，需更多并行能力）
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"

###################################
# Beat 服务（定时任务调度器）
###################################
beat:
  enabled: true

  # ⚠️ 资源配置：修复OOMKilled问题
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"     # 提高：原 128Mi → 256Mi（启动需要更多内存）
    limits:
      cpu: "500m"         # 提高：原 300m → 500m
      memory: "512Mi"     # 提高：原 256Mi → 512Mi（修复OOMKilled）

  updateStrategy:
    type: Recreate

  logLevel: INFO

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # Beat 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "3"
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "2"
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 1.13.x 新增：uv 包管理器缓存目录
    - name: UV_CACHE_DIR
      value: "/tmp/.uv-cache"
    # 1.13.x 新增：Celery 任务注解
    - name: CELERY_TASK_ANNOTATIONS
      value: "null"
    # 1.13.x 新增：HITL 人工输入超时检查
    - name: ENABLE_HUMAN_INPUT_TIMEOUT_TASK
      value: "true"
    - name: HUMAN_INPUT_TIMEOUT_TASK_INTERVAL
      value: "1"
    # 工作流日志清理（海外集群：使用 Dify 官方清理任务）
    - name: ENABLE_WORKFLOW_RUN_CLEANUP_TASK
      value: "true"
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"

###################################
# Web 前端服务优化
###################################
web:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "500m"         # 降低：原 500m → 100m
      memory: "512Mi"     # 降低：原 512Mi → 512Mi
    limits:
      cpu: "2000m"         # 降低：原 1000m → 1000m
      memory: "1Gi"     # 降低：原 1Gi → 1Gi

  autoscaling:
    enabled: false        # 小集群关闭 HPA，节省资源

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname

###################################
# Sandbox 服务优化（代码执行）
###################################
sandbox:
  enabled: true
  replicas: 2

  resources:
    requests:
      cpu: "1000m"
      memory: "512Mi"
    limits:
      cpu: "3000m"
      memory: "2Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4        # 提高：3 → 4（向量库独立后释放资源，code 节点高并发时可多扩 1 个）
    targetCPUUtilizationPercentage: 70

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - sandbox
            topologyKey: kubernetes.io/hostname

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: WORKER_TIMEOUT
      value: "15"

###################################
# Proxy 服务优化
###################################
proxy:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "128Mi"     # 降低：原 256Mi → 128Mi
    limits:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "256Mi"     # 降低：原 512Mi → 256Mi

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - proxy
            topologyKey: kubernetes.io/hostname

  clientMaxBodySize: "100m"

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# SSRF Proxy 服务
###################################
ssrfProxy:
  enabled: true
  replicas: 1

  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "256Mi"     # 降低：原 1Gi → 256Mi
    limits:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "1Gi"     # 降低：原 2Gi → 1Gi

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# Plugin Daemon 服务
###################################
pluginDaemon:
  enabled: true
  replicas: 2             # 提高：1 → 2（支持零停机更新 + 分担负载）

  # ⚠️ 资源配置：提高 CPU 限制解决限流问题
  # 问题：CPU limit 1核导致限流(throttling)，LLM调用从4-7秒变成9-12秒
  # 原因：plugin-daemon 运行 15+ 个 Python 插件进程，需要更多 CPU
  resources:
    requests:
      cpu: "1000m"        # 提高：500m → 1000m
      memory: "2Gi"       # 提高：1Gi → 2Gi
    limits:
      cpu: "3000m"        # 提高：1000m → 2000m（关键！解决CPU限流）
      memory: "4Gi"       # 保持不变

  # 延迟接入流量配置（解决启动时编译问题）
  # 问题：plugin-daemon 启动需要 5-8 分钟编译插件，期间不应接收请求
  # 方案：使用 HTTP 健康检查 + 足够长的延迟，确保编译完成后才接入流量
  customReadinessProbe:
    httpGet:
      path: /health/check    # 使用 HTTP 健康检查而非 TCP
      port: 5002
    initialDelaySeconds: 420  # 7分钟：确保插件编译完成（原 240 秒不够）
    periodSeconds: 10         # 每 10 秒检查一次
    timeoutSeconds: 5
    failureThreshold: 30      # 允许失败 30 次（5 分钟容错）
    successThreshold: 1       # 成功 1 次即可

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - plugin-daemon
            topologyKey: kubernetes.io/hostname

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # PluginDaemon 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "5"          # 降低：原 20 → 5
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "3"          # 降低：原 10 → 3
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"

###################################
# Service 配置
###################################
service:
  type: ClusterIP
  port: 80

###################################
# 全局资源配置
###################################
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ==============================================================================
# 小集群配置说明（4C8G * 3 = 12C 24G，向量库 Qdrant 已独立到集群外）
# ==============================================================================
#
# 资源分配预算（requests 维度，常态）：
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ 组件           │ 副本 │ CPU requests │ 内存 requests │ 角色（1.13.x）          │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ API            │ 2    │ 1000m        │ 2Gi           │ blocking workflow + SSE │
# │ Worker         │ 1    │ 1000m        │ 3Gi           │ streaming workflow + 后台│
# │ Beat           │ 1    │ 100m         │ 256Mi         │ 定时任务调度            │
# │ Web            │ 1    │ 500m         │ 512Mi         │ 前端                    │
# │ Sandbox        │ 2    │ 2000m        │ 1Gi           │ 代码节点执行            │
# │ Proxy          │ 1    │ 100m         │ 128Mi         │ Nginx 反向代理          │
# │ SSRF Proxy     │ 1    │ 100m         │ 256Mi         │ SSRF 防护               │
# │ Plugin Daemon  │ 2    │ 2000m        │ 4Gi           │ 插件运行时              │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Dify 总计      │ -    │ ~6800m       │ ~11.2Gi       │                         │
# │ K8s 系统预留   │ -    │ ~1500m       │ ~1.5Gi        │                         │
# │ 总使用量       │ -    │ ~8300m       │ ~12.7Gi       │ 占总资源 69% / 53%      │
# │ 集群可用       │ -    │ 12000m       │ 24Gi          │                         │
# │ 剩余缓冲       │ -    │ ~3700m       │ ~11.3Gi       │ 留给 HPA 扩容 + 突发     │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# HPA 峰值预算（API maxReplicas=5, Sandbox maxReplicas=4）：
#   - API:       5 × 1C/2G = 5C/10G（requests）
#   - Sandbox:   4 × 1C/0.5G = 4C/2G（requests）
#   - 其余组件不弹缩
#   - 峰值 Dify 总 requests ≈ 9.2C / 15.5G，仍在集群可用范围内（K8s 预留后约 10.5C/22G）
#
# 数据库连接数预算（RDS max_connections = 400）：
#   - API:          5 Pod × 2 worker × (20+10) = 300（HPA 峰值）
#   - Worker:       1 Pod × 1 进程 × (15+5)    = 20
#   - Beat:         1 Pod × (3+2)              = 5
#   - PluginDaemon: 2 Pod × (5+3)              = 16
#   - 总计峰值：~341 / 400（85% 安全水位，建议监控；如频繁触及可考虑提高 RDS 上限）
#
# 向量库（外部 Qdrant，独立机器）：
#   - 在 values-secrets.yaml 中启用：
#       externalQdrant.enabled: true
#       externalQdrant.endpoint: "http://<qdrant-host>:6333"
#       externalQdrant.apiKey: "<api-key>"
#   - 数据迁移：旧集群（Milvus）→ 新集群（Qdrant）需要重建索引（详见升级手册）
#
# 性能预期：
#   - 支持 50-100 并发用户（峰值通过 HPA 自动扩到 5 副本可达 ~250 并发）
#   - 适合海外小流量生产环境（日请求数万级）
#
# 使用方式：
# helm upgrade dify charts/dify -f values-dify.yaml -f values-secrets.yaml -f values-dify-prod.yaml -n dify
# ==============================================================================
