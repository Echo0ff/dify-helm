  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# Plugin Daemon 服务
###################################
pluginDaemon:
  enabled: true
  replicas: 2             # 提高：1 → 2（支持零停机更新 + 分担负载）

  # ⚠️ 资源配置：提高 CPU 限制解决限流问题
  # 问题：CPU limit 1核导致限流(throttling)，LLM调用从4-7秒变成9-12秒
  # 原因：plugin-daemon 运行 15+ 个 Python 插件进程，需要更多 CPU
  resources:
    requests:
      cpu: "1000m"        # 提高：500m → 1000m
      memory: "2Gi"       # 提高：1Gi → 2Gi
    limits:
      cpu: "3000m"        # 提高：1000m → 2000m（关键！解决CPU限流）
      memory: "4Gi"       # 保持不变

  # 延迟接入流量配置（解决启动时编译问题）
  # 问题：plugin-daemon 启动需要 5-8 分钟编译插件，期间不应接收请求
  # 方案：使用 HTTP 健康检查 + 足够长的延迟，确保编译完成后才接入流量
  customReadinessProbe:
    httpGet:
      path: /health/check    # 使用 HTTP 健康检查而非 TCP
      port: 5002
    initialDelaySeconds: 420  # 7分钟：确保插件编译完成（原 240 秒不够）
    periodSeconds: 10         # 每 10 秒检查一次
    timeoutSeconds: 5
    failureThreshold: 30      # 允许失败 30 次（5 分钟容错）
    successThreshold: 1       # 成功 1 次即可

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - plugin-daemon
            topologyKey: kubernetes.io/hostname

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # PluginDaemon 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "5"          # 降低：原 20 → 5
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "3"          # 降低：原 10 → 3
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"

###################################
# Service 配置
###################################
service:
  type: ClusterIP
  port: 80

###################################
# 全局资源配置
###################################
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ==============================================================================
# 小集群配置说明（4C8G * 3 = 12C 24G）
# ==============================================================================
#
# 资源分配预算：
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ 组件           │ 副本 │ CPU requests │ 内存 requests │ 占比           │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ API            │ 2    │ 1000m        │ 2Gi           │ 核心服务       │
# │ Worker         │ 1    │ 300m         │ 512Mi         │ 异步任务       │
# │ Beat           │ 1    │ 100m         │ 128Mi         │ 定时任务       │
# │ Web            │ 1    │ 100m         │ 128Mi         │ 前端           │
# │ Sandbox        │ 1    │ 200m         │ 256Mi         │ 代码执行       │
# │ Proxy          │ 1    │ 100m         │ 128Mi         │ 反向代理       │
# │ SSRF Proxy     │ 1    │ 100m         │ 256Mi         │ SSRF 防护      │
# │ Plugin Daemon  │ 1    │ 500m         │ 4Gi           │ 插件服务       │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Dify 总计      │ -    │ 2400m        │ 4.4Gi         │               │
# │ K8s 系统预留   │ -    │ ~1500m       │ ~1.5Gi        │               │
# │ Milvus 预留    │ -    │ ~2000m       │ ~4Gi          │ 向量数据库     │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ 总使用量       │ -    │ ~5900m       │ ~14Gi         │               │
# │ 可用资源       │ -    │ 12000m       │ 24Gi          │               │
# │ 剩余缓冲       │ -    │ ~6100m       │ ~14Gi         │ 50%+ 余量 ✅   │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# 数据库连接数预算（数据库上限 400）：
#   - API: 2~4 Pod × 2 worker × (20+10) = 120~240 连接
#   - Worker: 1 Pod × (10+5) = 15 连接
#   - Beat: 1 Pod × (3+2) = 5 连接
#   - PluginDaemon: 2 Pod × (5+3) = 16 连接
#   - 总计：156~276 连接（HPA 最大 4 pod 时 276，安全余量 31%）
#
# Milvus 部署建议：
#   1. 使用 Milvus Standalone 模式（非集群模式）
#   2. 推荐资源配置：
#      - requests: 1.5C / 3Gi
#      - limits: 2C / 4Gi
#   3. 建议使用 nodeSelector 将 Milvus 固定到一个节点
#   4. 可以与 Dify 组件共存，资源足够
#
# 性能预期：
#   - 支持 50-100 并发用户
#   - 适合开发/测试/小规模生产环境
#   - 如需更高并发，建议升级节点配置
#
# 使用方式：
# helm upgrade dify charts/dify -f values-dify.yaml -f values-secrets.yaml -f values-dify-prod.yaml -n dify
# ==============================================================================
