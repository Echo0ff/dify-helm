# ============================================
# Dify Helm Chart - 生产环境配置（小集群版）
# ============================================
# 说明：
# - 本文件针对小规模集群优化（4C8G * 3 = 12C 24G）
# - 需要预留资源给 Milvus 向量数据库
# - 配合 values-secrets.yaml 使用
#
# 集群配置（3节点小集群）: 
#   - Node 1-3: 4C/8G (standard)
#   - 其中一个节点部署 Milvus（预留 ~2C/4G）
#
# 资源预算：
#   - 总资源：12C / 24G
#   - K8s 系统预留：~1.5C / 1.5G
#   - Milvus 预留：~2C / 4G
#   - Dify 可用：~8.5C / 18.5G
#
# 部署命令：
# helm upgrade dify ./charts/dify -n dify \
#   -f values-dify.yaml \
#   -f values-secrets.yaml \
#   -f values-dify-prod.yaml
# ============================================

###################################
# API 服务优化
###################################
api:
  enabled: true
  # 小集群：2 个副本足够
  replicas: 2
  
  # 外部访问URL配置
  url:
    appWeb: "http://3.19.168.125"
    files: "http://3.19.168.125"
  
  # ⚠️ 资源配置：大幅降低以适应小集群
  resources:
    requests:
      cpu: "500m"       # 降低：原 1000m → 500m
      memory: "1Gi"     # 降低：原 2Gi → 1Gi
    limits:
      cpu: "1000m"      # 降低：原 2000m → 1000m
      memory: "2Gi"     # 降低：原 4Gi → 2Gi

  # 自定义 prompts
  persistence:
    enabled: true
    volumes:
      - name: custom-prompts
        configMap:
          name: dify-prompts
    volumeMounts:
      - name: custom-prompts
        mountPath: /app/api/core/llm_generator/prompts.py
        subPath: prompts.py
        readOnly: true
  
  # HPA：小集群保守配置
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3        # 降低：原 4 → 3（资源有限）
    targetCPUUtilizationPercentage: 80   # 提高阈值，减少扩容频率
    targetMemoryUtilizationPercentage: 80
  
  # 健康检查
  livenessProbe:
    enabled: true
    initialDelaySeconds: 45
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 12
    successThreshold: 1
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 20
    failureThreshold: 8
    successThreshold: 1
  
  # 滚动更新策略
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1         # 降低：原 3 → 1（资源有限）
      maxUnavailable: 0
  
  # Pod 拓扑分散：小集群更需要均匀分布
  topologySpreadConstraints:
    - maxSkew: 1          # 严格均匀分布
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: api
  
  # 亲和性：小集群简化配置
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - api
            topologyKey: kubernetes.io/hostname
  
  logLevel: INFO
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: CHECK_UPDATE_URL
      value: ""
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Gunicorn 配置：小集群降低并发
    - name: SERVER_WORKER_AMOUNT
      value: "2"          # 保持 2 个 worker
    - name: SERVER_WORKER_CLASS
      value: "gevent"
    - name: SERVER_WORKER_CONNECTIONS
      value: "30"         # 降低：原 50 → 30（减少内存压力）
    - name: GUNICORN_TIMEOUT
      value: "360"
    # ⚠️ 数据库连接池：小集群大幅降低
    - name: SQLALCHEMY_POOL_SIZE
      value: "10"         # 降低：原 50 → 10
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "5"          # 降低：原 20 → 5
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_ECHO
      value: "false"
    - name: SQLALCHEMY_ECHO_POOL
      value: "false"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Redis 连接池：小集群降低
    - name: REDIS_POOL_SIZE
      value: "10"         # 降低：原 40 → 10
    - name: REDIS_POOL_MAX_CONNECTIONS
      value: "20"         # 降低：原 60 → 20
    - name: CELERY_BROKER_POOL_LIMIT
      value: "10"         # 降低：原 40 → 10
    # 性能配置
    - name: HTTP_REQUEST_MAX_CONNECT_TIMEOUT
      value: "30"
    - name: HTTP_REQUEST_MAX_READ_TIMEOUT
      value: "60"
    - name: HTTP_REQUEST_MAX_WRITE_TIMEOUT
      value: "30"
    - name: RETRY_TIMES
      value: "3"
    - name: WEB_API_CORS_ALLOW_ORIGINS
      value: "*"
    - name: SENTRY_DSN
      value: ""
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "5"  # 增加初始并行 worker 数
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "10"  # 最大并行数
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"  # 降低扩容阈值，更快触发并行

###################################
# Worker 服务优化
###################################
worker:
  enabled: true
  replicas: 1
  
  # ⚠️ 资源配置：降低以适应小集群
  resources:
    requests:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "512Mi"     # 降低：原 2Gi → 512Mi
    limits:
      cpu: "800m"         # 降低：原 2000m → 800m
      memory: "1Gi"       # 降低：原 4Gi → 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 85
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          component: worker
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 40
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - worker
            topologyKey: kubernetes.io/hostname
  
  logLevel: INFO
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # ⚠️ Worker 数据库连接池：小集群降低
    - name: SQLALCHEMY_POOL_SIZE
      value: "5"          # 降低：原 40 → 5
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "3"          # 降低：原 20 → 3
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # Celery Worker：小集群降低并发
    - name: CELERY_AUTO_SCALE
      value: "true"
    - name: CELERY_MAX_WORKERS
      value: "2"          # 降低：原 4 → 2
    - name: CELERY_MIN_WORKERS
      value: "1"          # 降低：原 2 → 1
    - name: CELERY_WORKER_CLASS
      value: "gevent"
    - name: MAX_TASK_PRE_CHILD
      value: "100"
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"
    - name: GRAPH_ENGINE_MIN_WORKERS
      value: "5"  # 增加初始并行 worker 数
    - name: GRAPH_ENGINE_MAX_WORKERS
      value: "10"  # 最大并行数
    - name: GRAPH_ENGINE_SCALE_UP_THRESHOLD
      value: "1"  # 降低扩容阈值，更快触发并行

###################################
# Beat 服务（定时任务调度器）
###################################
beat:
  enabled: true
  
  # ⚠️ 资源配置：修复OOMKilled问题
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"     # 提高：原 128Mi → 256Mi（启动需要更多内存）
    limits:
      cpu: "500m"         # 提高：原 300m → 500m
      memory: "512Mi"     # 提高：原 256Mi → 512Mi（修复OOMKilled）
  
  updateStrategy:
    type: Recreate
  
  logLevel: INFO
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # Beat 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "3"          # 降低：原 10 → 3
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "2"          # 降低：原 5 → 2
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "true"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"
    - name: CODE_MAX_NUMBER
      value: "9223372036854775807"
    - name: CODE_MIN_NUMBER
      value: "-9223372036854775808"
    - name: CODE_MAX_DEPTH
      value: "10"
    - name: CODE_MAX_PRECISION
      value: "20"
    - name: CODE_MAX_STRING_LENGTH
      value: "80000"
    - name: CODE_MAX_STRING_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_OBJECT_ARRAY_LENGTH
      value: "70"
    - name: CODE_MAX_NUMBER_ARRAY_LENGTH
      value: "1000"
    - name: CODE_EXECUTION_CONNECT_TIMEOUT
      value: "10"
    - name: CODE_EXECUTION_READ_TIMEOUT
      value: "360"
    - name: CODE_EXECUTION_WRITE_TIMEOUT
      value: "10"

###################################
# Web 前端服务优化
###################################
web:
  enabled: true
  replicas: 1
  
  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "128Mi"     # 降低：原 512Mi → 128Mi
    limits:
      cpu: "500m"         # 降低：原 1000m → 500m
      memory: "512Mi"     # 降低：原 1Gi → 512Mi
  
  autoscaling:
    enabled: false        # 小集群关闭 HPA，节省资源
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - web
            topologyKey: kubernetes.io/hostname

###################################
# Sandbox 服务优化（代码执行）
###################################
sandbox:
  enabled: true
  replicas: 1             # ⚠️ 降低：原 2 → 1（节省资源）
  
  # ⚠️ 资源配置：大幅降低
  resources:
    requests:
      cpu: "200m"         # 降低：原 1000m → 200m
      memory: "256Mi"     # 降低：原 2Gi → 256Mi
    limits:
      cpu: "500m"         # 降低：原 2000m → 500m
      memory: "1Gi"     # 降低：原 4Gi → 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 1        # 降低：原 2 → 1
    maxReplicas: 2        # 降低：原 3 → 2
    targetCPUUtilizationPercentage: 70
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - sandbox
            topologyKey: kubernetes.io/hostname
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: WORKER_TIMEOUT
      value: "15"

###################################
# Proxy 服务优化
###################################
proxy:
  enabled: true
  replicas: 1
  
  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "128Mi"     # 降低：原 256Mi → 128Mi
    limits:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "256Mi"     # 降低：原 512Mi → 256Mi
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - proxy
            topologyKey: kubernetes.io/hostname
  
  clientMaxBodySize: "100m"

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# SSRF Proxy 服务
###################################
ssrfProxy:
  enabled: true
  replicas: 1
  
  # ⚠️ 资源配置：降低
  resources:
    requests:
      cpu: "100m"         # 降低：原 500m → 100m
      memory: "256Mi"     # 降低：原 1Gi → 256Mi
    limits:
      cpu: "300m"         # 降低：原 1000m → 300m
      memory: "1Gi"     # 降低：原 2Gi → 1Gi
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"

###################################
# Plugin Daemon 服务
###################################
pluginDaemon:
  enabled: true
  replicas: 1
  
  # ⚠️ 资源配置：大幅降低（原配置过高）
  resources:
    requests:
      cpu: "500m"         # 降低：原 2000m → 500m
      memory: "1Gi"       # 降低：原 4Gi → 1Gi
    limits:
      cpu: "1000m"        # 降低：原 4000m → 1000m
      memory: "4Gi"       # 降低：原 6Gi → 4Gi
  
  # 延迟接入流量配置
  customReadinessProbe:
    tcpSocket:
      port: 5002
    initialDelaySeconds: 240
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - plugin-daemon
            topologyKey: kubernetes.io/hostname
  
  extraEnv:
    - name: TZ
      value: "Asia/Shanghai"
    - name: LOG_TZ
      value: "Asia/Shanghai"
    # PluginDaemon 数据库连接池
    - name: SQLALCHEMY_POOL_SIZE
      value: "5"          # 降低：原 20 → 5
    - name: SQLALCHEMY_MAX_OVERFLOW
      value: "3"          # 降低：原 10 → 3
    - name: SQLALCHEMY_POOL_RECYCLE
      value: "270"
    - name: SQLALCHEMY_POOL_PRE_PING
      value: "true"
    - name: SQLALCHEMY_POOL_TIMEOUT
      value: "180"
    - name: SQLALCHEMY_POOL_RESET_ON_RETURN
      value: "rollback"
    - name: SQLALCHEMY_POOL_USE_LIFO
      value: "true"
    # 自动删除日志
    - name: WORKFLOW_LOG_CLEANUP_ENABLED
      value: "false"
    - name: WORKFLOW_LOG_RETENTION_DAYS
      value: "4"
    - name: WORKFLOW_LOG_CLEANUP_BATCH_SIZE
      value: "50"

###################################
# Service 配置
###################################
service:
  type: ClusterIP
  port: 80

###################################
# 全局资源配置
###################################
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# ==============================================================================
# 小集群配置说明（4C8G * 3 = 12C 24G）
# ==============================================================================
#
# 资源分配预算：
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ 组件           │ 副本 │ CPU requests │ 内存 requests │ 占比           │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ API            │ 2    │ 1000m        │ 2Gi           │ 核心服务       │
# │ Worker         │ 1    │ 300m         │ 512Mi         │ 异步任务       │
# │ Beat           │ 1    │ 100m         │ 128Mi         │ 定时任务       │
# │ Web            │ 1    │ 100m         │ 128Mi         │ 前端           │
# │ Sandbox        │ 1    │ 200m         │ 256Mi         │ 代码执行       │
# │ Proxy          │ 1    │ 100m         │ 128Mi         │ 反向代理       │
# │ SSRF Proxy     │ 1    │ 100m         │ 256Mi         │ SSRF 防护      │
# │ Plugin Daemon  │ 1    │ 500m         │ 4Gi           │ 插件服务       │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Dify 总计      │ -    │ 2400m        │ 4.4Gi         │               │
# │ K8s 系统预留   │ -    │ ~1500m       │ ~1.5Gi        │               │
# │ Milvus 预留    │ -    │ ~2000m       │ ~4Gi          │ 向量数据库     │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ 总使用量       │ -    │ ~5900m       │ ~14Gi         │               │
# │ 可用资源       │ -    │ 12000m       │ 24Gi          │               │
# │ 剩余缓冲       │ -    │ ~6100m       │ ~14Gi         │ 50%+ 余量 ✅   │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# 数据库连接数预算（小集群）：
#   - API: 2 Pod × 15 = 30 连接
#   - Worker: 1 Pod × 8 = 8 连接
#   - Beat: 1 Pod × 5 = 5 连接
#   - PluginDaemon: 1 Pod × 8 = 8 连接
#   - 总计：~51 连接（远低于数据库上限）
#
# Milvus 部署建议：
#   1. 使用 Milvus Standalone 模式（非集群模式）
#   2. 推荐资源配置：
#      - requests: 1.5C / 3Gi
#      - limits: 2C / 4Gi
#   3. 建议使用 nodeSelector 将 Milvus 固定到一个节点
#   4. 可以与 Dify 组件共存，资源足够
#
# 性能预期：
#   - 支持 50-100 并发用户
#   - 适合开发/测试/小规模生产环境
#   - 如需更高并发，建议升级节点配置
#
# 使用方式：
# helm upgrade dify charts/dify -f values-dify.yaml -f values-secrets.yaml -f values-dify-prod.yaml -n dify
# ==============================================================================
