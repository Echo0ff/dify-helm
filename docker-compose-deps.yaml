# ==================================================================
# Dify 外部依赖服务 Docker Compose
# 用于小集群部署（4C8G 节点）
# ==================================================================
# 资源预算（单节点 4C8G）：
#   - Milvus: ~1.5C / 3G
#   - etcd: ~0.2C / 256M
#   - MinIO: ~0.3C / 512M
#   - 总计: ~2C / 4G（留一半给系统和其他服务）
# ==================================================================

version: '3.8'

services:
  # Milvus 依赖 - etcd
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: dify-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 2147483648
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - ./volumes/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dify-deps
    # ⚠️ 资源限制
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25

  # Milvus 依赖 - MinIO（用于 Milvus 内部存储）
  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: dify-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./volumes/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - dify-deps
    # ⚠️ 资源限制
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 0.5

  # Milvus 向量数据库（Standalone 模式）
  milvus:
    image: milvusdb/milvus:v2.5.15
    container_name: dify-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      common.security.authorizationEnabled: "true"
      # ⚠️ 内存优化配置（适配小内存节点）
      # 查询节点内存缓存限制
      queryNode.cache.memoryLimit: 1gb
      # 索引节点内存限制
      indexNode.scheduler.buildParallel: 1
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"      # gRPC 端口
      - "9091:9091"        # 健康检查端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 240s
      timeout: 10s
      retries: 10
    depends_on:
      - etcd
      - milvus-minio
    networks:
      - dify-deps
    # ⚠️ 资源限制（核心配置）
    mem_limit: 6g
    mem_reservation: 3g
    memswap_limit: 7g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 90s

networks:
  dify-deps:
    driver: bridge
